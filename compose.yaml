services:
  email-mcp:
    build: .
    image: email-mcp:local
    ports:
      - "${PORT:-3000}:3000"
    environment:
      SMTP_HOST: ${SMTP_HOST:-mock}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
